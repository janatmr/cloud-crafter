# Override for local Minikube demos (Phase 2/4 style): points every subchart back at
# the bare image names built straight into Minikube's Docker daemon instead of GHCR,
# since a local cluster has no route to pull the real ghcr.io/janatmr/cloud-crafter/*
# images pushed by Phase 5's CI. Build with:
#
#   eval $(minikube docker-env)
#   for s in users events tickets notifications; do
#     docker build -t $s:1.0.0 services/$s
#   done
#
# Then deploy with:
#
#   helm upgrade --install cloudcrafter ./charts/cloudcrafter -f charts/cloudcrafter/values-minikube.yaml
users:
  image:
    repository: users
    tag: "1.0.0"
events:
  image:
    repository: events
    tag: "1.0.0"
tickets:
  image:
    repository: tickets
    tag: "1.0.0"
notifications:
  image:
    repository: notifications
    tag: "1.0.0"
