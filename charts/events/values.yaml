replicaCount: 1

image:
  repository: ghcr.io/janatmr/cloud-crafter/events
  tag: "91697c84c8923cbda6560201a3f988dc940ee9c2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# Scraped by kube-prometheus-stack's Prometheus Operator (spec §22/§23) — requires
# the ServiceMonitor CRD to already exist in the cluster (installed with the
# observability stack). Disable if that CRD isn't installed yet.
serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

rollingUpdate:
  maxUnavailable: 25%
  maxSurge: 25%

env:
  - name: PORT
    value: "3000"
