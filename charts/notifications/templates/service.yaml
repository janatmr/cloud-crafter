apiVersion: v1
kind: Service
metadata:
  name: {{ include "notifications.name" . }}
  labels:
    {{- include "notifications.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "notifications.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
