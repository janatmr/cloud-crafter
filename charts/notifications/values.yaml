replicaCount: 1

image:
  repository: ghcr.io/janatmr/cloud-crafter/notifications
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

rollingUpdate:
  maxUnavailable: 25%
  maxSurge: 25%

env:
  - name: PORT
    value: "3000"
