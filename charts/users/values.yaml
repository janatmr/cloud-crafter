replicaCount: 2

image:
  repository: ghcr.io/janatmr/cloud-crafter/users
  tag: "4d0b02761457f5723c1e0d18e79aaf607a3c6025"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# Scraped by kube-prometheus-stack's Prometheus Operator (spec §22/§23) — requires
# the ServiceMonitor CRD to already exist in the cluster (installed with the
# observability stack). Disable if that CRD isn't installed yet.
serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Rolling update tuned for zero-downtime JWT key rotation (spec §32) — at least
# one ready replica throughout, never all replicas down at once.
rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

env:
  - name: PORT
    value: "3000"

# JWT signing/verification keys are never baked into the image or values.yaml —
# they're mounted from a Kubernetes Secret (created in Phase 9: `users-jwt-keys`).
jwtKeys:
  enabled: true
  secretName: users-jwt-keys
  mountPath: /etc/jwt-keys
  privateKeyPath: /etc/jwt-keys/private.key
  publicKeyPath: /etc/jwt-keys/public.key
